<!DOCTYPE html>
<html lang="sv" data-theme="light">


<head>
    <meta name="viewport" content="width=device-width, minimum-scale=1, maximum-scale=1">
    <meta charset="utf-8">
    <title>
TEST - 
 Jokkmokks Energi AB</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/style.css" />
    <script src="/serviceAlert.js"></script>
    


<script src="/modal.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script type="text/javascript">
    (function () {
        // https://dashboard.emailjs.com/admin/account
        emailjs.init({
            publicKey: "PGxa1G5RMRfC2K90H",
            //publicKey: "fail",
        });
    })();
</script>
<script type="text/javascript">
    window.onload = function () {
        document.getElementById('contact-form').addEventListener('submit', function (event) {
            event.preventDefault();
            const btn = document.querySelector("#form-submit") 
            const email_result = document.querySelector("#email-result")
            btn.ariaBusy = true
            // these IDs from the previous steps
            emailjs.sendForm('service_fmc8dck', 'template_gw2mdzv', this)
                .then(() => {
                    email_result.querySelector("main").innerHTML = "<h1><i class=\"icon-warning-circle-light\"></i></h1><h2>Ditt meddelande har skickats!</h2><p>Vi hör av oss så fort vi kan.</p>"
                    openModal(email_result)
                    this.reset()
                }, (error) => {
                    email_result.querySelector("main").innerHTML = "<h1><i class=\"icon-warning-circle-light\"></i></h1><h2>Fel</h2><p>Ditt meddelande kunde inte skickats!</p>"
                    openModal(email_result)
                    console.log('FAILED...', error)
                });
            btn.ariaBusy = false
        });
    }
</script>



</head>

<body>
    <template id="alert-template">
        <header id="alert">
            <details id="messages">
                <summary role="button"><i class="icon-warning-light"></i> Driftmeddelanden</summary>
            </details>
        </header>
    </template>
    <div id="alert-pos"></div>
    <div id="start"></div>
    <header id="menu" style="z-index: 2;">
        <nav>
            <ul>
                <li><a href="/#start"><img class="desktop" src="/logo.png" /><img class="mobile"
                            src="/symbol.png" /></a>
                </li>
            </ul>
            <ul>
                <li id="alert-menu-item"></li>
                <li><a href="/#nyheter" role="button">Nyheter</a></li>
                
                <li><a href="/#tjanster" role="button">Tjänster</a></li>
                
                <li><a href="/#priser" role="button">Priser</a></li>
                
                <li><a href="/#kontakt" role="button">Kontakt</a></li>
            </ul>
        </nav>
    </header>
    
    
    <main id="content" style="text-align: center;">
        
<section>
    <div style="text-align: left;">    
        <h1 id="test">Test</h1>
<div class="grid" style="z-index: 999; position: fixed; right: 1rem; top: 1rem; grid-template-columns: 1fr">
<button onclick="servicealert_main()" >Main</button>
<button onclick="servicealert_main('test.json')">Test</button>
<button onclick="servicealert_main('test_all_normal.json')">Normal</button>
<button onclick="servicealert_main('test_all_normal.json')">All Normal</button>
<button onclick="servicealert_main('test_critical.json')">Critical</button>
<button onclick="servicealert_main('empty.json')">Clear</button>
</div>
    </div>
    <hr />
</section>

<h2>Kontaktformulär</h2>

<form id="contact-form">
    <fieldset>
        <input type="hidden" name="subject" value="TEST" />
        <label>
            Namn
            <input name="name" placeholder="Namn" autocomplete="given-name" required="true" />
        </label>
        <label>
            Email
            <input type="email" name="email" placeholder="Email" autocomplete="email" required="true" />
        </label>
        <label>
            Meddelande
            <textarea name="message" placeholder="Meddelande" aria-label="message" required="true" ></textarea>
        </label>
    </fieldset>
    <input id="form-submit" type="submit" value="Skicka" />
</form>
<div id="form-submit"></div>
<dialog id="email-result">
    <article>
        <main></main>
        <button data-target="email-confirm" onclick="closeModal(visibleModal)">OK</button>
    </article>
</dialog>



        
        
        <div class="float-bottom">
            <a href="#alert" id="alert-button" class="floating-button" role="link" data-tooltip="Driftmeddelanden"
                data-placement="left">
                <i class="icon-warning-light"></i>
            </a>
            <a href="#start" id="top-button" class="floating-button" data-tooltip="Till topps!" data-placement="left">
                <i class="icon-angle-double-up"></i>
            </a>
        </div>
    </main>

        <small>0971-17338</small> |

    </footer>

</body>

</html>
